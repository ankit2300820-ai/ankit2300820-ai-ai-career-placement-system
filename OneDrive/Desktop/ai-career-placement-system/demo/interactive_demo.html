body{background:radial-gradient(circle at top left,#1b1f3b 0%,#0e1117 55%) fixed}
.hero{background:linear-gradient(120deg,#4f46e5,#7c3aed,#db2777,#4f46e5);background-size:300% 300%;animation:shift 9s ease infinite,fadeUp .7s both;box-shadow:0 10px 30px rgba(124,58,237,.25)}

 const total=+Object.values(parts).reduce((a,b)=>a+b,0).toFixed(1);
 return{total,parts,band:total>=80?'Excellent':total>=65?'Good':total>=50?'Average':'Needs Improvement'}}
function prob(p,n){const M=C.model;let z=M.intercept;M.features.forEach((f,i)=>{const x=f==='num_skills'?n:p[f];z+=M.coef[i]*(x-M.mean[i])/M.scale[i]});return 1/(1+Math.exp(-z))}
function whatIf(p,n){const base=+(prob(p,n)*100).toFixed(1),lim={cgpa:10,coding_score:100,aptitude:100,communication:10};
 const tw=(ch,dn=0)=>{const q={...p};for(const[k,v]of Object.entries(ch))q[k]=clamp(q[k]+v,0,lim[k]||99);return +(prob(q,n+dn)*100).toFixed(1)};
 const sc={'+1 internship':tw({internships:1}),'+2 projects':tw({projects:2},2),'+15 coding score':tw({coding_score:15}),'+15 aptitude':tw({aptitude:15}),
  '+2 communication':tw({communication:2}),'+1 certification':tw({certifications:1}),'+3 new skills':tw({},3)};
 if(p.backlogs>0)sc['Clear all backlogs']=tw({backlogs:-p.backlogs});
 return Object.entries(sc).map(([k,v])=>({Scenario:k,'New probability %':v,'Change (pts)':+(v-base).toFixed(1)})).sort((a,b)=>b['Change (pts)']-a['Change (pts)'])}
function companies(p,sk,rs){const have=new Set(sk.map(s=>s.toLowerCase()));
 return C.comp.map(c=>{const f=[];if(p.cgpa<c.min_cgpa)f.push('CGPA below '+c.min_cgpa);if(p.backlogs>c.max_backlogs)f.push('Backlogs above '+c.max_backlogs);
  if(p.tenth_pct<c.min_10th)f.push('10th below '+c.min_10th+'%');if(p.twelfth_pct<c.min_12th)f.push('12th below '+c.min_12th+'%');
  const req=c.required_skills.split(';'),miss=req.filter(s=>!have.has(s.toLowerCase())),sm=1-miss.length/req.length;
  return{Company:c.name,Tier:c.tier,Role:c.roles,LPA:c.avg_package_lpa,Eligible:f.length?'No':'Yes',Compat:+(100*(0.55*sm+0.25*Math.min(1,p.cgpa/(c.min_cgpa+1.5))+0.2*rs/100)).toFixed(1),Missing:miss.join(', ')||'-',Why:f.join('; ')||'-'}})
  .sort((a,b)=>(a.Eligible<b.Eligible?1:a.Eligible>b.Eligible?-1:0)||b.Compat-a.Compat)}
function roadmap(sk,role,h){let wk=1;const imp={3:'High',2:'Medium',1:'Low'};
 return roleMatch(sk,role).missing.map(s=>{const[res,base]=C.learning[s]||['Official docs + one mini project',2],w=Math.max(1,Math.ceil(base*10/h)),r={Skill:s,Priority:imp[C.roles[role][s]],Resource:res,Weeks:w,Schedule:`Week ${wk}-${wk+w-1}`};wk+=w;return r})}
function questions(role,sk){const req=Object.keys(C.roles[role]),order=req.filter(s=>sk.includes(s)).concat(req.filter(s=>!sk.includes(s)));
 return order.filter(s=>C.bank[s]).flatMap(s=>C.bank[s].map(([q,h])=>({s,q,h})))}

const S={name:'',email:'',cgpa:7,tenth_pct:75,twelfth_pct:75,backlogs:0,internships:0,projects:1,certifications:0,hackathons:0,coding_score:50,aptitude:50,communication:6,role:'Software Developer',skills:[],resumeText:''};
const DEMO={name:'Aarav Sharma',cgpa:8.1,tenth_pct:86,twelfth_pct:82,backlogs:0,internships:1,projects:3,certifications:2,hackathons:1,coding_score:62,aptitude:60,communication:7,role:'Data Scientist',skills:['Python','Pandas','NumPy','SQL','Scikit-learn','Machine Learning','Git','Excel']};
const SAMPLE='Rahul Verma | rahul@mail.com\nCGPA: 7.6\nSkills: Java, Spring Boot, MySQL, REST API, OOP, Data Structures, Git, Docker\nProjects: Library management system (Java + MySQL), REST API for e-commerce\nInternship at ABC Tech (Backend)';
const A={name:'Ankit',email:'ankitchadrabad9389@gmail.com',github:'https://github.com/your-username',linkedin:'https://www.linkedin.com/in/ankit-b47699332',college:'B.Tech CSE (Final Year)'};
const E=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),U=u=>/^https?:\/\//.test(u)?E(u):'#';
const aCard=()=>`<div class="author"><div class="avatar">${E((A.name[0]||'A').toUpperCase())}</div><div><h3>${E(A.name)}</h3><p>${E(A.college)} · Creator of this project</p><a class="pill" href="mailto:${E(A.email)}">✉️ ${E(A.email)}</a><a class="pill" href="${U(A.github)}" target="_blank">🐙 GitHub</a><a class="pill" href="${U(A.linkedin)}" target="_blank">💼 LinkedIn</a></div></div>`;
const PAGES=['👤 Profile','📄 Resume & Skills','📊 Dashboard','💼 Career Match','🎯 Readiness & Prediction','🏢 Companies','🛣️ Skill Gap & Roadmap','🎤 Interview Prep','ℹ️ About'];
let page=PAGES[0],hrs=10,onlyEl=false,ticks={};
const $=id=>document.getElementById(id),root=$('root');
const bars=(it,fmt=v=>v.toFixed(1)+'%',mx=100)=>it.map(([k,v])=>`<div class="bl"><span>${k}</span><div><div class="bar" style="width:${Math.max(1,v/mx*100)}%"></div></div><span>${fmt(v)}</span></div>`).join('');
const tbl=(rows,cols,fx={})=>rows.length?`<div class="wx"><table><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr>${rows.map(r=>`<tr>${cols.map(c=>`<td>${fx[c]?fx[c](r[c]):r[c]}</td>`).join('')}</tr>`).join('')}</table></div>`:'<p>—</p>';
function gauge(v,c,l,suf=''){const a=Math.PI*(1-v/100);return `<svg viewBox="0 0 200 120"><path d="M20,100A80,80 0 0 1 180,100" fill="none" stroke="#2c3347" stroke-width="16"/><path d="M20,100A80,80 0 0 1 ${100+80*Math.cos(a)},${100-80*Math.sin(a)}" fill="none" stroke="${c}" stroke-width="16"/><text x="100" y="95" text-anchor="middle" fill="#e8eaf6" font-size="28" font-weight="700">${v}${suf}</text><text x="100" y="116" text-anchor="middle" fill="#9aa3c0" font-size="11">${l}</text></svg>`}
function radar(parts){const k=Object.keys(parts),n=k.length,A=i=>2*Math.PI*i/n-Math.PI/2,pts=k.map((x,i)=>{const r=parts[x]/C.maxes[x]*80;return(100+r*Math.cos(A(i)))+','+(100+r*Math.sin(A(i)))}).join(' ');
 const grid=[.33,.66,1].map(s=>`<polygon points="${k.map((_,i)=>(100+80*s*Math.cos(A(i)))+','+(100+80*s*Math.sin(A(i)))).join(' ')}" fill="none" stroke="#2c3347"/>`).join('');
 return `<svg viewBox="-15 0 230 205">${grid}<polygon points="${pts}" fill="rgba(124,58,237,.45)" stroke="#a78bfa" stroke-width="2"/>${k.map((x,i)=>`<text x="${100+96*Math.cos(A(i))}" y="${100+96*Math.sin(A(i))}" text-anchor="middle" fill="#9aa3c0" font-size="8">${x}</text>`).join('')}</svg>`}
const calc=()=>{const r=readiness(S,S.skills,S.role),p=prob(S,S.skills.length);return{r,p}};
function num(v,suf,anim){const n=Math.round(v);return anim?`<span class="count" style="--n:${n}"></span>${suf}`:`${n}${suf}`}
function strip(anim){const{r,p}=calc();const m=(l,v,sub,i)=>`<div class="m ${anim?'kp':''}" style="animation-delay:${i*.1}s"><div class="l">${l}</div><div class="v">${v}</div><div class="l">${sub}</div></div>`;
 return `<div class="strip">${m('Readiness',num(r.total,'/100',anim),r.band,0)}${m('Placement probability (ML)',num(p*100,'%',anim),'synthetic-data model',1)}${m('Skills',num(S.skills.length,'',anim),'profile + resume',2)}${m('Target role',`<span style="font-size:16px">${S.role}</span>`,'change in Profile',3)}</div>`}
function refreshStrip(){const e=$('strip');if(e)e.innerHTML=strip(false)}
function field(label,key,min,max,step=1){return `<div><label>${label}</label><input type="number" min="${min}" max="${max}" step="${step}" value="${S[key]}" oninput="S['${key}']=+this.value;refreshStrip()"></div>`}
function slider(label,key,min,max){return `<div><label>${label}: <b id="sv_${key}">${S[key]}</b></label><input type="range" min="${min}" max="${max}" value="${S[key]}" oninput="S['${key}']=+this.value;$('sv_${key}').textContent=this.value;refreshStrip()"></div>`}
function chips(){return C.all_skills.map(s=>`<span class="chip ${S.skills.includes(s)?'on':''}" onclick="togSkill('${s}')">${s}</span>`).join('')}
function togSkill(s){const i=S.skills.indexOf(s);i<0?S.skills.push(s):S.skills.splice(i,1);$('chips').innerHTML=chips();refreshStrip();$('sc').textContent=S.skills.length}
function loadDemo(){Object.assign(S,DEMO,{skills:[...DEMO.skills]});show()}
const V={
'ℹ️ About':()=>`<div id="acard">${aCard()}</div><div class="box"><h4>Edit author details (in the real app: .env file → AUTHOR_* values)</h4><div class="g3">${[['Name','name'],['Email','email'],['GitHub URL','github'],['LinkedIn URL','linkedin']].map(([l,k])=>`<div><label>${l}</label><input type="text" value="${E(A[k])}" oninput="A['${k}']=this.value;$('acard').innerHTML=aCard()"></div>`).join('')}</div></div>
<div class="box"><h4>About this project</h4><p style="font-size:14px;line-height:1.6;margin-top:0">AI Career & Placement System helps B.Tech students analyse skills, check placement readiness, find suitable roles and companies, close skill gaps with a roadmap, and prepare for interviews — using a SQL database, rule-based analytics and a scikit-learn model inside a Streamlit app.</p>${['Python','Pandas','NumPy','Scikit-learn','Streamlit','Plotly','MySQL','SQLite','fpdf2','pytest','Docker','GitHub Actions'].map((b,i)=>`<span class="badge" style="animation-delay:${i*.05}s">${b}</span>`).join('')}<div class="warn">ML model is trained on synthetic data; company criteria are illustrative. Educational project.</div></div>`,
'👤 Profile':()=>`<div class="box"><h4>Student profile (saved to SQL in the real app)</h4><div class="g3">${field('CGPA','cgpa',0,10,.01)}${field('10th %','tenth_pct',0,100)}${field('12th %','twelfth_pct',0,100)}${field('Backlogs','backlogs',0,20)}${field('Internships','internships',0,10)}${field('Projects','projects',0,20)}${field('Certifications','certifications',0,20)}${field('Hackathons','hackathons',0,20)}
<div><label>Target role</label><select onchange="S.role=this.value;refreshStrip()">${Object.keys(C.roles).map(r=>`<option ${r==S.role?'selected':''}>${r}</option>`).join('')}</select></div></div>
<div class="g3" style="margin-top:12px">${slider('Coding score (0-100)','coding_score',0,100)}${slider('Aptitude score (0-100)','aptitude',0,100)}${slider('Communication (1-10)','communication',1,10)}</div></div>
<div class="box"><h4>Skills you know (<span id="sc">${S.skills.length}</span> selected) – click to toggle</h4><div id="chips">${chips()}</div></div>
<button class="btn" onclick="loadDemo()">⚡ Load demo student</button><button class="btn s" onclick="go('📊 Dashboard')">See my results →</button>`,
'📄 Resume & Skills':()=>`<div class="box"><h4>Paste resume text or upload a .txt file (real app also reads PDF/DOCX)</h4><textarea id="rt" placeholder="Paste your resume here...">${S.resumeText}</textarea><input type="file" accept=".txt" id="rf" style="margin:8px 0;color:var(--mu)"><br><button class="btn" onclick="extract()">🔍 Extract skills</button><button class="btn s" onclick="$('rt').value=SAMPLE">Use sample resume</button><div id="rout"></div></div>`,
'📊 Dashboard':()=>{const{r}=calc(),rec=recommend(S.skills);return `<div class="g3" style="grid-template-columns:1fr 1fr"><div class="box"><h4>Readiness profile</h4>${radar(r.parts)}</div><div class="box"><h4>Top role matches</h4>${bars(rec.slice(0,6).map(x=>[x.role,x.match]))}</div></div><div class="box"><h4>Score breakdown</h4>${bars(Object.entries(r.parts),v=>v,30)}</div>`},
'💼 Career Match':()=>{const rec=recommend(S.skills);return `<div class="box"><h4>Job-role compatibility %</h4>${bars(rec.map(x=>[x.role,x.match]))}</div><div class="ok">Best fit right now: <b>${rec[0].role}</b> (${rec[0].match}%)</div><div class="box">${tbl(rec,['role','match','coverage','missing'],{missing:v=>v.join(', ')||'—'})}</div>`},
'🎯 Readiness & Prediction':()=>{const{r,p}=calc();return `<div class="g3" style="grid-template-columns:1fr 1fr"><div class="box">${gauge(r.total,'#7c3aed','Readiness ('+r.band+')')}</div><div class="box">${gauge(+(p*100).toFixed(1),'#db2777','ML placement probability','%')}</div></div>
<div class="box"><h4>What should I improve? (re-runs the real model)</h4>${tbl(whatIf(S,S.skills.length),['Scenario','New probability %','Change (pts)'],{'Change (pts)':v=>`<span class="${v>=0?'yes':'no'}">${v>0?'+':''}${v}</span>`})}</div>
<div class="warn">⚠️ Model trained on SYNTHETIC data — indicative only. Test metrics: ${Object.entries(C.model.metrics).map(([k,v])=>k+' '+v).join(' · ')}</div>`},
'🏢 Companies':()=>{const rs=calc().r.total;let rows=companies(S,S.skills,rs);if(onlyEl)rows=rows.filter(x=>x.Eligible=='Yes');return `<label style="font-size:14px;color:var(--tx)"><input type="checkbox" ${onlyEl?'checked':''} onchange="onlyEl=this.checked;show()"> Show only eligible companies</label><div class="box" style="margin-top:8px">${bars(rows.slice(0,8).map(x=>[x.Company,x.Compat]))}</div><div class="box">${tbl(rows,['Company','Tier','LPA','Eligible','Compat','Missing','Why'],{Eligible:v=>`<span class="${v=='Yes'?'yes':'no'}">${v}</span>`,Compat:v=>v+'%'})}</div><p class="note">Company criteria are illustrative (data/companies.csv).</p>`},
'🛣️ Skill Gap & Roadmap':()=>{const rd=roadmap(S.skills,S.role,hrs),w=rd.reduce((a,x)=>a+x.Weeks,0);return `<div class="box"><h4>Study hours per week: <b id="hv">${hrs}</b></h4><input type="range" min="5" max="40" value="${hrs}" oninput="hrs=+this.value;$('hv').textContent=hrs;$('rmap').innerHTML=rm()"></div><div id="rmap">${rm()}</div>`},
'🎤 Interview Prep':()=>{const q=questions(S.role,S.skills);return `<div class="box"><h4>Technical questions for ${S.role} (your strong skills first)</h4>${q.map((x,i)=>`<details><summary>[${x.s}] ${x.q}</summary><p>💡 ${x.h}</p><label style="color:var(--tx)"><input type="checkbox" ${ticks['t'+i]?'checked':''} onchange="ticks['t${i}']=this.checked"> I can answer this</label></details>`).join('')}</div><div class="box"><h4>HR questions</h4>${C.hr.map(([a,b])=>`<details><summary>${a}</summary><p>💡 ${b}</p></details>`).join('')}</div>`}};
function rm(){const rd=roadmap(S.skills,S.role,hrs),w=rd.reduce((a,x)=>a+x.Weeks,0);return rd.length?`<div class="ok">Estimated time to close all gaps: <b>${w} weeks</b> at ${hrs} hrs/week</div><div class="box">${tbl(rd,['Skill','Priority','Resource','Weeks','Schedule'])}</div>`:'<div class="ok">No skill gaps for this role 🎉</div>'}
async function extract(){const f=$('rf').files[0];let t=$('rt').value;if(f)t=await f.text();S.resumeText=t;const sk=extractSkills(t),meta=extractMeta(t);
 $('rout').innerHTML=`<div class="ok">Extracted ${sk.length} skills</div>${sk.map(s=>`<span class="chip on">${s}</span>`).join('')}<pre style="color:#a5b4fc">${JSON.stringify(meta,null,2)}</pre><button class="btn" id="addb">✅ Add to my profile</button>`;
 $('addb').onclick=()=>{sk.forEach(s=>{if(!S.skills.includes(s))S.skills.push(s)});if(meta.cgpa)S.cgpa=meta.cgpa;$('addb').textContent='✓ Added! Check Profile / Dashboard';refreshStrip()}}
function go(p){page=p;show()}
function show(){if(!S.name){root.innerHTML=`<div class="auth"><div class="hero"><h2><span class="float">🎓</span> AI Career & Placement System</h2><p><span class="typing">Skills analysis, placement prediction & your personal roadmap</span></p></div><p style="color:var(--mu);font-size:13px">Built by <b>${E(A.name)}</b> · ${E(A.email)}</p><div class="box"><label>Full name</label><input type="text" id="n"><br><br><label>Email</label><input type="email" id="e"><br><br><label>Password</label><input type="password" id="pw"><br><br><button class="btn" onclick="reg()">Create account</button><button class="btn s" onclick="loadDemo()">⚡ Skip with demo student</button></div></div>`;return}
 root.innerHTML=`<div class="wrap"><nav><h3 style="margin:0 0 10px">👋 ${S.name.split(' ')[0]}</h3>${PAGES.map(p=>`<button class="${p==page?'on':''}" onclick="go('${p}')">${p}</button>`).join('')}<button onclick="S.name='';show()">Logout</button><p style="color:var(--mu);font-size:12px;margin:14px 6px">Made with ❤️ by <b>${E(A.name)}</b></p></nav><main><div class="hero"><h2>${page}</h2><p>${S.name} · fill your info on the Profile page — everything updates live</p></div><div id="strip">${strip(true)}</div><div id="pg">${V[page]()}</div><div class="note">Interactive demo: same model coefficients, rules and company data as the Python project. Real app = Streamlit + SQL.</div></main></div>`}
function reg(){const n=$('n').value.trim();if(!n)return alert('Enter your name');S.name=n;S.email=$('e').value;page=PAGES[0];show()}
show();
</script></body></html>
